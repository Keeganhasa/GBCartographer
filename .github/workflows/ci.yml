name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          # The tests and the web build don't need Electron's binary.
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Tests (including the smoke test on the demo project)
        run: npm test
      - name: Web build
        run: npm run build
      - name: Desktop bundle
        run: npm run desktop:build
